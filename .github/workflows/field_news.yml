name: Daily Field News

on:
  schedule:
    # About 6:29am ET, ahead of the morning email. Off the hour because GitHub
    # runs on-the-hour jobs late.
    - cron: '29 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: field-news
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  field-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Brief each field
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API }}
        run: python scripts/field_news.py

      - name: Refresh quotes
        # quotes_cache.json is gitignored, so a fresh checkout has no prices.
        run: python scripts/refresh_quotes.py

      - name: Build radar
        run: python scripts/radar.py

      - name: Rebuild dashboard
        run: python scripts/build_dashboard.py

      - name: Sync with remote before commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Two jobs can rebuild this generated file at once, and the conflict used to
          # lose the whole commit. Drop ours, pull, then rebuild on the latest data.
          git checkout -- output/dashboard.json
          git pull --rebase --autostash origin main
          python scripts/build_dashboard.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: daily field news"
          file_pattern: >-
            data/field_news.json
            data/radar.json
            data/radar_log.json
            output/dashboard.json

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Field news failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure']
            })
