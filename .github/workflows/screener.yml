name: Weekly Discovery Screener

on:
  schedule:
    # Saturdays 12:00 UTC (8am ET) — fresh ideas before the week
    - cron: '0 12 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pandas lxml

      - name: Run professional multi-factor screener (S&P 500)
        run: python scripts/screener.py --universe sp500 --limit 15

      - name: Rebuild dashboard with discoveries
        run: python scripts/build_dashboard.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: weekly discovery screen"
          file_pattern: >-
            data/discovered.json
            output/dashboard.json

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly screener failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure', 'screener']
            })
