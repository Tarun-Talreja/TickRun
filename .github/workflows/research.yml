name: Generate Research Briefs

on:
  schedule:
    - cron: '0 13 * * 1'  # Monday 8am ET (after Sunday screener)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate research briefs
        run: python generate_research.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: research briefs updated"
          file_pattern: output/research_briefs.json

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Research brief generation failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck that ANTHROPIC_API_KEY secret is set: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/settings/secrets/actions`,
              labels: ['automation-failure', 'research']
            })
