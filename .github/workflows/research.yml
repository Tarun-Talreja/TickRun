name: Daily LLM Research

on:
  schedule:
    # 5:41am ET daily. Weekdays-only couldn't keep the watchlist fresh:
    # ~6 names/run × 5 days < 51 names re-going-stale every 7 days.
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'How many tickers to research this run (catch-up runs can go higher)'
        required: false
        default: '8'
      tickers:
        description: 'Optional comma-separated tickers to research instead of the queue'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: llm-research
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  research:
    runs-on: ubuntu-latest
    # Was 20m and hit the cap repeatedly; each ticker runs research + bear check.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync watchlist.md
        run: python scripts/sync_watchlist.py

      - name: Refresh quotes
        run: python scripts/refresh_quotes.py

      - name: Run daily LLM research (NVIDIA NIM, free)
        id: research
        # Let SEC/news/dashboard steps and the commit still run, then fail the
        # job at the end (see "Fail if research produced nothing").
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API }}
          TICKERS: ${{ github.event.inputs.tickers }}
          MAX_TICKERS: ${{ github.event.inputs.max || 8 }}
        run: python scripts/research_batch.py --max "$MAX_TICKERS" --tickers "$TICKERS"

      - name: Check SEC filings
        run: python scripts/sec_filings.py
        continue-on-error: true

      - name: Cache ticker news
        run: python scripts/news_feed.py
        continue-on-error: true

      - name: Asset location (Roth vs taxable)
        run: python scripts/asset_location.py
        continue-on-error: true

      - name: Data sanity check
        run: python scripts/data_sanity.py
        continue-on-error: true

      - name: Rebuild dashboard
        run: python scripts/build_dashboard.py

      - name: Sync with remote before commit
        # Long runs can be overtaken by another push; auto-commit does not
        # rebase, so without this its push is rejected and the run's work is lost.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: daily LLM research + SEC filings"
          file_pattern: >-
            data/watchlist.json
            data/asset_location.json
            data/sec_filings.json
            data/news_cache.json
            data/data_quality.json
            data/research_status.json
            output/research/
            output/dashboard.json

      - name: Fail if research produced nothing
        if: steps.research.outcome == 'failure'
        run: |
          echo "::error::research_batch.py landed 0 tickers — check the model chain (python scripts/llm_client.py) and the NVIDIA_API secret."
          exit 1

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily research failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure', 'research']
            })
