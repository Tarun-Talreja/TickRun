name: Daily LLM Research

on:
  schedule:
    # 7am ET weekdays (11:00 UTC) — before market open, after overnight news
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync watchlist.md
        run: python scripts/sync_watchlist.py

      - name: Refresh quotes
        run: python scripts/refresh_quotes.py

      - name: Run daily LLM research (NVIDIA NIM, free)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API }}
        run: python scripts/research_batch.py --max 6

      - name: Check SEC filings
        run: python scripts/sec_filings.py
        continue-on-error: true

      - name: Cache ticker news
        run: python scripts/news_feed.py
        continue-on-error: true

      - name: Rebuild dashboard
        run: python scripts/build_dashboard.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: daily LLM research + SEC filings"
          file_pattern: >-
            data/watchlist.json
            data/sec_filings.json
            data/news_cache.json
            output/research/
            output/dashboard.json

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily research failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure', 'research']
            })
