name: Bear Check Eval

# Measures the live bear check against real notes and planted breaks. Weekly,
# because NVIDIA can change or retire a model without notice.
on:
  schedule:
    - cron: '37 11 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Refresh quotes
        run: python scripts/refresh_quotes.py
      - name: Run eval
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API }}
        run: python scripts/bear_eval.py

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Bear check eval failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Ratings may be unreliable until this is looked at. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure']
            })
