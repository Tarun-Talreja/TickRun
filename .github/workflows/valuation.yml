name: Daily Valuation

on:
  schedule:
    # After the close on weekdays, off the hour because GitHub drops runs at :00/:30.
    - cron: '43 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: valuation
  cancel-in-progress: false

env:
  SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  value:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Refresh quotes
        run: python scripts/refresh_quotes.py

      - name: Filed figures from the SEC
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          python scripts/sec_facts.py
          python scripts/company_measures.py

      - name: Serious news and filings
        run: python scripts/company_events.py
        continue-on-error: true

      - name: Value each company
        run: python scripts/valuation.py

      - name: Rebuild dashboard
        run: python scripts/build_dashboard.py

      - name: Sync with remote before commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- output/dashboard.json
          bash scripts/sync_with_main.sh
          python scripts/build_dashboard.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: daily valuation"
          file_pattern: >-
            data/fundamentals.json
            data/company_measures.json
            data/valuations.json
            data/company_events.json
            output/dashboard.json

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily valuation failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure']
            })
