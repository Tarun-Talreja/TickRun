name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'output/**'
      - '.github/workflows/pages.yml'
  # The data workflows commit with GITHUB_TOKEN, and GitHub never fires `push`
  # workflows for GITHUB_TOKEN pushes — so the push trigger above alone left the
  # live site frozen at 2026-07-26 while the repo data kept updating daily.
  # workflow_run is exempt from that rule: redeploy whenever a data job finishes.
  # Names here are glob patterns: keep + ? * ! [ ] out of workflow names, or the
  # filter silently never matches ("Quote Refresh + Alerts" did exactly that).
  workflow_run:
    workflows:
      - "Quote Refresh and Alerts"
      - "Daily LLM Research"
      - "Catalyst Lookahead and Alerts"
      - "Weekly Dashboard Rebuild"
      - "Weekly Discovery Screener"
      - "Quarterly Hedge Fund Signal"
      - "Filing Deep-Dive (10-K RAG)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Explicit ref: deploy the newest main (including the commit the data job
      # just pushed), not the SHA the upstream run started from.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stage site files only
        run: |
          mkdir -p _site/output
          cp index.html _site/index.html
          cp output/dashboard.json _site/output/dashboard.json 2>/dev/null || echo "dashboard.json not yet generated — site will show sample data"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
