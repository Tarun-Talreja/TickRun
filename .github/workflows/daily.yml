name: Quote Refresh + Alerts

on:
  schedule:
    # Every 30 min during US market hours. Cron is UTC (no DST), and the US is
    # on EDT (UTC-4) most of the trading year, so 13:30 UTC = 9:30am ET open.
    # 13:00-20:00 covers the full session incl. the open (was 14:00 — missed first 30m).
    - cron: '0,30 13-20 * * 1-5'
    # Plus end-of-day final at 6pm ET (22:00 UTC)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Runs fire every 30 min; if one is slow, don't let a queue of overlapping
# runs build up (they'd race on the same auto-commit).
concurrency:
  group: daily-refresh
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 10m was too tight once the pipeline grew (movers/news/SEC steps).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync watchlist.md → data/watchlist.json
        run: python scripts/sync_watchlist.py

      - name: Refresh quotes (portfolio + watchlist only)
        run: python scripts/refresh_quotes.py

      - name: Generate pullback alerts
        run: python scripts/pullback_alerts.py

      - name: Update earnings calendar
        run: python scripts/earnings_calendar.py

      - name: Check SEC EDGAR filings (early smart-money signal)
        run: python scripts/sec_filings.py
        continue-on-error: true

      - name: Cache ticker news
        run: python scripts/news_feed.py
        continue-on-error: true

      - name: Detect + explain price movers
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API }}
        run: python scripts/move_explainer.py
        continue-on-error: true

      - name: Data sanity check
        run: python scripts/data_sanity.py
        continue-on-error: true

      - name: Buy-target alerts
        run: python scripts/target_alerts.py
        continue-on-error: true

      - name: Portfolio analytics (P&L, allocation, concentration, dividends)
        run: python scripts/portfolio_analytics.py
        continue-on-error: true

      - name: Track record scoreboard
        run: python scripts/track_record.py
        continue-on-error: true

      - name: Asset location (Roth vs taxable)
        run: python scripts/asset_location.py
        continue-on-error: true

      - name: Assemble dashboard.json
        run: python scripts/build_dashboard.py

      - name: Sync with remote before commit
        # Long runs can be overtaken by another push; auto-commit does not
        # rebase, so without this its push is rejected and the run's work is lost.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: daily quote refresh"
          file_pattern: >-
            data/watchlist.json
            data/sec_filings.json
            data/news_cache.json
            data/movers.json
            data/price_snapshot.json
            data/data_quality.json
            data/asset_location.json
            data/target_alerts.json
            data/verdict_history.json
            output/dashboard.json
            output/portfolio_analytics.json
            output/track_record.json
            output/alerts.json
            output/earnings_calendar.json

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily refresh failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure']
            })
