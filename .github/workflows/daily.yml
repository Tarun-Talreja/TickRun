name: Fetch Daily Data

on:
  schedule:
    - cron: '0 13 * * 1-5'  # 8am ET (EDT) / 9am ET (EST), Mon-Fri
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance==0.2.51 requests jsonschema tenacity

      - name: Fetch daily data
        run: python fetch_daily.py

      - name: Validate output JSON
        run: python tests/validate_output.py daily

      - name: Smoke test
        run: python -m pytest tests/test_daily.py -v

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: daily data update"
          file_pattern: output/daily.json

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily fetch failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure', 'daily']
            })
