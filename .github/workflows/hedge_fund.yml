name: Quarterly Hedge Fund Signal

# 13F filings due 45 days after each quarter end:
#   Q4 (Dec 31) → due Feb 14  | Q1 (Mar 31) → due May 15
#   Q2 (Jun 30) → due Aug 14  | Q3 (Sep 30) → due Nov 14
# Run on the 15th of Feb / May / Aug / Nov at 2pm UTC.

on:
  schedule:
    - cron: '0 14 15 2,5,8,11 *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hedge-fund:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch hedge fund / institutional holder signals
        run: python scripts/hedge_fund_signal.py

      - name: Rebuild dashboard with new signals
        run: python scripts/build_dashboard.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: quarterly hedge fund signal refresh"
          file_pattern: |
            data/hedge_fund_signals.json
            data/hedge_fund_snapshot.json
            output/dashboard.json

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Hedge fund signal failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure']
            })
