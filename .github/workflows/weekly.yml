name: Run Weekly Screener

on:
  schedule:
    - cron: '0 22 * * 0'  # 6pm ET (EDT) / 5pm ET (EST), Sunday
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance==0.2.51 pandas requests jsonschema tenacity

      - name: Run pipeline (universe → fundamentals → composite)
        run: python fetch_weekly.py

      - name: Validate output JSON
        run: python tests/validate_output.py weekly

      - name: Smoke test
        run: python -m pytest tests/test_weekly.py tests/test_composite.py -v

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: weekly composite run"
          file_pattern: |
            output/weekly_screens.json
            data/universe.json
            data/fundamentals.json

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly screener failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure', 'weekly']
            })
