name: Weekly Dashboard Rebuild

on:
  schedule:
    - cron: '0 22 * * 0'  # 6pm ET Sunday
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync watchlist.md → data/watchlist.json
        run: python scripts/sync_watchlist.py

      - name: Refresh all quotes
        run: python scripts/refresh_quotes.py

      - name: Check insider activity
        run: python scripts/insider_check.py

      - name: Generate pullback alerts
        run: python scripts/pullback_alerts.py

      - name: Update earnings calendar
        run: python scripts/earnings_calendar.py

      - name: Data sanity check
        run: python scripts/data_sanity.py
        continue-on-error: true

      - name: Assemble dashboard.json
        run: python scripts/build_dashboard.py

      - name: Weekly plain-English digest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API }}
        run: python scripts/weekly_digest.py
        continue-on-error: true

      - name: Re-assemble dashboard with digest embedded
        run: python scripts/build_dashboard.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: weekly dashboard rebuild + digest"
          file_pattern: >-
            data/watchlist.json
            data/insider_signals.json
            data/data_quality.json
            output/dashboard.json
            output/weekly_digest.json
            output/alerts.json
            output/earnings_calendar.json

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly rebuild failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure', 'weekly']
            })
