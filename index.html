<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tickreja</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#060910;--bg1:#0c1018;--bg2:#111820;--bg3:#182030;--bg4:#1e2838;
  --border:#1c2a3a;--border-hi:#2a3f55;
  --text0:#ddeeff;--text1:#7a9ab8;--text2:#3d5570;--text3:#1e3040;
  --cyan:#00d9f5;--cyan-d:#00293a;
  --green:#00f082;--green-d:#002918;
  --red:#ff4455;--red-d:#2d0008;
  --amber:#ffaa00;--amber-d:#2d1e00;
  --violet:#b08fff;--violet-d:#1a1040;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-in:cubic-bezier(0.7,0,0.84,0);
}
html,body{
  background:var(--bg0);color:var(--text0);
  font-family:var(--mono);font-size:13px;
  height:100%;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ═══════════════════════════════════════════════
   INTRO SCREEN
═══════════════════════════════════════════════ */
#intro{
  position:fixed;inset:0;z-index:1000;
  background:var(--bg0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:32px;
}
#intro.fade-out{
  animation:introOut .6s var(--ease-in) forwards;
}
@keyframes introOut{to{opacity:0;transform:scale(1.04)}}

.intro-mark{
  display:flex;flex-direction:column;align-items:center;gap:20px;
}
.hex-wrap{position:relative;width:72px;height:72px}
.hex-svg{position:absolute;inset:0}
.hex-ring{
  stroke-dasharray:240;stroke-dashoffset:240;
  animation:drawHex 0.7s var(--ease-out) 0.2s forwards;
}
.hex-tick{
  stroke-dasharray:60;stroke-dashoffset:60;
  animation:drawTick 0.5s var(--ease-out) 0.9s forwards;
}
@keyframes drawHex{to{stroke-dashoffset:0}}
@keyframes drawTick{to{stroke-dashoffset:0}}

.intro-wordmark{
  display:flex;align-items:baseline;gap:0;
  font-family:var(--mono);font-size:42px;font-weight:600;letter-spacing:2px;
  overflow:hidden;
}
.letter{
  display:inline-block;opacity:0;transform:translateY(20px);
  animation:letterIn .35s var(--ease-out) forwards;
}
.letter.tick{color:var(--cyan)}
.letter.reja{color:var(--text0);font-weight:300}

.intro-tagline{
  font-size:10px;letter-spacing:5px;color:var(--text2);text-transform:uppercase;
  opacity:0;animation:fadeUp .4s ease 1.6s forwards;
}
.intro-loading{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;animation:fadeUp .4s ease 1.8s forwards;
}
.intro-bar{
  width:160px;height:2px;background:var(--bg3);border-radius:1px;overflow:hidden;
}
.intro-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:1px;
  width:0%;animation:barLoad 1.2s ease 1.9s forwards;
}
@keyframes barLoad{to{width:100%}}
.intro-bar-label{font-size:9px;color:var(--text2);letter-spacing:2px}

@keyframes letterIn{to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ═══════════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════════ */
#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  opacity:0;transition:opacity .5s ease;
  overflow:hidden;
}
#app.visible{opacity:1}

/* ── TOP BAR ── */
.topbar{
  height:52px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:var(--bg1);
  border-bottom:1px solid var(--border);
  z-index:100;
  position:relative;
}
.topbar-logo{
  display:flex;align-items:center;gap:8px;
  font-size:17px;font-weight:600;letter-spacing:1px;cursor:pointer;
}
.topbar-logo .tick-part{
  background:linear-gradient(90deg,var(--cyan),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.topbar-logo .reja-part{color:var(--text0);font-weight:300}
.topbar-logo .hex-mini{margin-right:4px}

.topbar-right{display:flex;align-items:center;gap:10px}
.hamburger{
  width:36px;height:36px;background:none;border:1px solid var(--border);
  border-radius:6px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;transition:border-color .15s;
}
.hamburger:hover{border-color:var(--border-hi)}
.ham-line{width:16px;height:1.5px;background:var(--text1);border-radius:1px;transition:all .2s}

.live-chip{
  display:flex;align-items:center;gap:5px;
  padding:4px 8px;border-radius:4px;
  background:var(--green-d);border:1px solid #00f08222;
  font-size:9px;font-weight:500;color:var(--green);letter-spacing:.06em;
}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,240,130,.5)}60%{box-shadow:0 0 0 5px transparent}}

/* ── SCREEN STACK ── */
.screens{
  flex:1;position:relative;overflow:hidden;
}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  background:var(--bg0);
  transition:transform .45s var(--ease-out),opacity .35s ease;
  will-change:transform;
  padding-bottom:80px;
}
.screen.hidden-right{transform:translateX(100%);opacity:0;pointer-events:none}
.screen.hidden-left{transform:translateX(-6%);opacity:0;pointer-events:none}
.screen.active{transform:translateX(0);opacity:1;pointer-events:all}

/* ── BOTTOM NAV ── */
.bottom-nav{
  height:60px;flex-shrink:0;
  display:flex;align-items:stretch;
  background:var(--bg1);border-top:1px solid var(--border);
  z-index:100;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;cursor:pointer;
  font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text2);transition:color .15s;position:relative;
}
.nav-btn.active{color:var(--cyan)}
.nav-btn.active::before{
  content:'';position:absolute;top:0;left:20%;right:20%;
  height:2px;background:var(--cyan);border-radius:0 0 2px 2px;
}
.nav-btn svg{opacity:.5;transition:opacity .15s}
.nav-btn.active svg{opacity:1}
.nav-badge{
  position:absolute;top:6px;right:calc(50% - 16px);
  min-width:14px;height:14px;padding:0 3px;
  background:var(--red);color:#fff;
  font-size:7px;font-weight:700;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  animation:badgePop .3s var(--ease-out);
}
@keyframes badgePop{from{transform:scale(0)}to{transform:scale(1)}}

/* ── SIDE DRAWER ── */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
  backdrop-filter:blur(4px);
}
.drawer-overlay.open{opacity:1;pointer-events:all}
.side-drawer{
  position:fixed;left:0;top:0;bottom:0;width:min(280px,80vw);
  background:var(--bg1);border-right:1px solid var(--border);
  z-index:301;transform:translateX(-100%);
  transition:transform .4s var(--ease-out);
  display:flex;flex-direction:column;
  overflow-y:auto;
}
.side-drawer.open{transform:translateX(0)}
.drawer-header{
  padding:20px 20px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.drawer-close{
  width:28px;height:28px;background:var(--bg3);border:none;border-radius:4px;
  cursor:pointer;color:var(--text1);font-size:14px;display:flex;align-items:center;justify-content:center;
}
.drawer-nav{padding:12px 0;flex:1}
.dnav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;cursor:pointer;
  font-size:12px;color:var(--text1);letter-spacing:.04em;
  border-left:2px solid transparent;
  transition:all .15s;
}
.dnav-item:hover{background:var(--bg3);color:var(--text0)}
.dnav-item.active{color:var(--cyan);border-left-color:var(--cyan);background:var(--cyan-d)}
.dnav-icon{font-size:16px;width:20px;text-align:center}
.dnav-badge{margin-left:auto;padding:1px 6px;background:var(--red-d);color:var(--red);font-size:8px;border-radius:2px}
.drawer-footer{padding:16px 20px;border-top:1px solid var(--border);font-size:9px;color:var(--text2)}

/* ═══════════════════════════════════════════════
   HOME SCREEN
═══════════════════════════════════════════════ */
.home-hero{
  padding:24px 16px 0;
  display:flex;flex-direction:column;gap:4px;
}
.home-greeting{font-size:11px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase}
.home-headline{font-family:var(--sans);font-size:22px;font-weight:700;color:var(--text0);line-height:1.2}
.home-sub{font-size:10px;color:var(--text2);font-family:var(--sans);margin-top:2px}

/* Today's focus */
.focus-strip{
  display:flex;flex-direction:column;gap:8px;
  padding:16px 16px 0;
}
.focus-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;cursor:pointer;
  transition:transform .15s,border-color .15s;
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:14px;
}
.news-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.news-card{
  display:block;text-decoration:none;
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;transition:transform .15s,border-color .15s;
}
.news-card:hover{transform:translateY(-1px);border-color:var(--border-hi)}
.news-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.news-ticker{font-size:13px;font-weight:700;color:var(--text0)}
.news-date{margin-left:auto;font-size:11px;color:var(--text2)}
.news-title{font-size:14px;line-height:1.35;color:var(--text0);font-weight:500}
.news-pub{font-size:11px;color:var(--text2);margin-top:6px}
.report-link{display:inline-block;margin-top:8px;font-size:12px;color:var(--accent,#00f082);text-decoration:none;font-weight:600}
.report-link:hover{text-decoration:underline}
.sec-form{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--bg3);color:var(--text1)}
.sec-form.sec-stake{background:#00f08222;color:#00f082}
.mover-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.mover-pct{font-size:15px;font-weight:700}
.mover-reason{font-size:13px;line-height:1.4;color:var(--text0);margin-top:6px}
.data-warn{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:#ff445522;color:#ff6677;letter-spacing:.04em;cursor:help}
.conf-badge{font-size:8px;font-weight:700;padding:2px 5px;border-radius:4px;letter-spacing:.05em}
.conf-high{background:#00f08222;color:#00f082}
.conf-medium{background:#ffaa0022;color:#ffaa00}
.conf-low{background:#ff445522;color:#ff6677}
.digest-card{margin:0 16px 14px;padding:14px 16px;background:linear-gradient(135deg,var(--bg2),#0a1420);border:1px solid var(--border);border-radius:12px}
.digest-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--cyan);text-transform:uppercase;margin-bottom:7px}
.digest-text{font-size:13px;line-height:1.5;color:var(--text0)}
.focus-card::after{
  content:'';position:absolute;right:16px;top:50%;transform:translateY(-50%);
  width:6px;height:10px;
  border-right:1.5px solid var(--text2);border-top:1.5px solid var(--text2);
  transform:translateY(-50%) rotate(45deg);
}
.focus-card:hover{transform:translateY(-1px);border-color:var(--border-hi)}
.focus-card.urgent{border-color:#ff445533;background:linear-gradient(135deg,var(--bg2),#1a0808)}
.focus-card.buy{border-color:#00f08233;background:linear-gradient(135deg,var(--bg2),#001a0e)}
.focus-card.info{border-color:#00d9f522;background:linear-gradient(135deg,var(--bg2),#001820)}
.focus-icon{font-size:24px;flex-shrink:0}
.focus-content{flex:1;min-width:0}
.focus-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.focus-label.urgent{color:var(--red)}
.focus-label.buy{color:var(--green)}
.focus-label.info{color:var(--cyan)}
.focus-title{font-size:14px;font-weight:600;color:var(--text0);font-family:var(--sans)}
.focus-sub{font-size:11px;color:var(--text1);font-family:var(--sans);margin-top:2px;line-height:1.4}

/* Stat row */
.stat-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:16px;
}
.stat-tile{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;display:flex;flex-direction:column;gap:3px;
  animation:fadeUp .4s ease forwards;opacity:0;
}
.stat-tile-val{font-size:20px;font-weight:600;color:var(--text0)}
.stat-tile-label{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;font-family:var(--sans)}
.stat-tile-val.green{color:var(--green)}
.stat-tile-val.red{color:var(--red)}
.stat-tile-val.amber{color:var(--amber)}

/* Quick actions */
.quick-section{padding:0 16px 16px}
.qs-title{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-bottom:10px}
.stock-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;margin-bottom:7px;cursor:pointer;
  transition:transform .12s,border-color .12s;
  position:relative;
}
.stock-row::after{
  content:'›';position:absolute;right:14px;
  color:var(--text2);font-size:16px;line-height:1;
}
.stock-row:hover{transform:translateX(2px);border-color:var(--border-hi)}
.sr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sr-ticker{font-size:14px;font-weight:600;letter-spacing:.03em;color:var(--text0)}
.sr-name{font-size:9px;color:var(--text2);font-family:var(--sans);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-price{font-size:12px;font-weight:500;color:var(--text0);margin-right:8px}
.sr-action-chip{
  padding:2px 7px;border-radius:3px;font-size:8px;font-weight:600;letter-spacing:.06em;
}
.sac-buy{background:var(--green-d);color:var(--green)}
.sac-wait{background:var(--amber-d);color:var(--amber)}
.sac-watch{background:var(--cyan-d);color:var(--cyan)}

/* ═══════════════════════════════════════════════
   WATCHLIST SCREEN
═══════════════════════════════════════════════ */
.screen-header{
  padding:16px 16px 12px;
  border-bottom:1px solid var(--border);
  background:var(--bg1);
  position:sticky;top:0;z-index:10;
}
.sh-back{
  display:flex;align-items:center;gap:6px;
  font-size:10px;color:var(--text2);cursor:pointer;margin-bottom:8px;
  background:none;border:none;font-family:var(--mono);letter-spacing:.04em;
  transition:color .12s;
}
.sh-back:hover{color:var(--cyan)}
.sh-title{font-size:18px;font-weight:600;color:var(--text0)}
.sh-sub{font-size:10px;color:var(--text2);font-family:var(--sans);margin-top:2px}

.filter-row{
  display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none;
}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{
  padding:5px 11px;border-radius:20px;font-size:9px;font-weight:500;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  background:var(--bg3);border:1px solid var(--border);color:var(--text2);
  cursor:pointer;transition:all .12s;flex-shrink:0;
}
.filter-chip.active{background:var(--cyan-d);border-color:var(--cyan);color:var(--cyan)}
.theme-row{padding-top:8px}
.theme-chip{display:inline-flex;align-items:center;text-transform:none;letter-spacing:.02em;font-size:10px}
.theme-chip.active{color:#06121f;font-weight:700}

/* Search bar */
.search-wrap{
  padding:10px 16px 0;
  position:relative;
}
.search-input{
  width:100%;padding:9px 14px 9px 36px;
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  font-family:var(--mono);font-size:12px;color:var(--text0);
  outline:none;transition:border-color .15s;
}
.search-input::placeholder{color:var(--text2)}
.search-input:focus{border-color:var(--border-hi)}
.search-icon{
  position:absolute;left:26px;top:50%;transform:translateY(-50%);
  color:var(--text2);font-size:14px;pointer-events:none;
}

.wl-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.wl-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:14px;cursor:pointer;transition:transform .12s,border-color .12s;
  position:relative;
}
.wl-card::after{content:'›';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:18px}
.wl-card:hover{transform:translateX(3px);border-color:var(--border-hi)}
.wl-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;padding-right:20px}
.wl-card-ticker{font-size:17px;font-weight:600;color:var(--text0);letter-spacing:.03em}
.wl-card-name{font-size:9px;color:var(--text2);font-family:var(--sans);margin-top:1px}
.wl-card-badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.wl-card-metrics{display:flex;gap:16px;flex-wrap:wrap}
.wm{display:flex;flex-direction:column;gap:1px}
.wm-label{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.wm-val{font-size:12px;font-weight:500;color:var(--text1)}
.wm-val.hi{color:var(--green)}
.wm-val.lo{color:var(--red)}
.wm-val.mid{color:var(--amber)}
.wl-action-row{
  margin-top:10px;padding-top:10px;
  border-top:1px solid var(--border);
  font-size:10px;color:var(--text1);font-family:var(--sans);
  display:flex;align-items:flex-start;gap:6px;
}
.wl-action-icon{font-size:11px;flex-shrink:0;margin-top:1px}

/* ═══════════════════════════════════════════════
   STOCK DETAIL SCREEN
═══════════════════════════════════════════════ */
.detail-hero{
  padding:20px 16px 16px;
  border-bottom:1px solid var(--border);
  background:var(--bg1);
}
.detail-ticker-row{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:4px;
}
.detail-ticker{font-size:32px;font-weight:600;letter-spacing:.04em;color:var(--text0)}
.detail-name{font-size:11px;color:var(--text2);font-family:var(--sans);margin-bottom:12px}
.detail-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.detail-price{font-size:36px;font-weight:300;color:var(--text0)}
.detail-dd{font-size:14px;font-weight:500}
.detail-action-box{
  border-radius:10px;padding:14px 16px;margin-bottom:4px;
}
.dab-buy{background:linear-gradient(135deg,#001f0f,#002d16);border:1px solid #00f08244}
.dab-wait{background:linear-gradient(135deg,#1f1400,#2d1e00);border:1px solid #ffaa0044}
.dab-watch{background:linear-gradient(135deg,#001520,#001f2d);border:1px solid #00d9f544}
.dab-pass{background:var(--bg3);border:1px solid var(--border)}
.dab-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.dab-buy .dab-label{color:var(--green)}
.dab-wait .dab-label{color:var(--amber)}
.dab-watch .dab-label{color:var(--cyan)}
.dab-pass .dab-label{color:var(--text2)}
.dab-action{font-size:13px;font-weight:500;color:var(--text0);font-family:var(--sans);line-height:1.4}

.detail-metrics-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:16px;
}
.dm-tile{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;
}
.dmt-label{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.dmt-val{font-size:16px;font-weight:500;color:var(--text0)}
.dmt-val.hi{color:var(--green)}
.dmt-val.lo{color:var(--red)}
.dmt-val.mid{color:var(--amber)}

.detail-section{padding:0 16px 16px}
.ds-title{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin-bottom:10px;padding-top:16px;border-top:1px solid var(--border);margin-top:4px}
.thesis-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:14px;font-size:12px;line-height:1.8;color:var(--text1);
  font-family:var(--sans);
}
.signal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stag{padding:4px 9px;border-radius:4px;font-size:9px;font-weight:500;letter-spacing:.06em}
.stag-warn{background:var(--amber-d);color:var(--amber)}
.stag-good{background:var(--green-d);color:var(--green)}
.stag-info{background:var(--cyan-d);color:var(--cyan)}
.stag-bad{background:var(--red-d);color:var(--red)}
.stag-neutral{background:var(--bg3);color:var(--text1)}

/* ═══════════════════════════════════════════════
   SIGNALS SCREEN
═══════════════════════════════════════════════ */
.sig-feed{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.sig-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;cursor:pointer;
  transition:transform .12s,border-color .12s;
}
.sig-card:hover{transform:translateX(3px);border-color:var(--border-hi)}
.sig-card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  gap:10px;
}
.sig-type-label{
  font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 7px;border-radius:3px;
}
.stl-earnings{background:var(--red-d);color:var(--red)}
.stl-pullback{background:var(--green-d);color:var(--green)}
.stl-sale{background:var(--violet-d);color:var(--violet)}
.stl-short{background:var(--amber-d);color:var(--amber)}
.stl-hf{background:var(--cyan-d);color:var(--cyan)}

.sig-card-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.scb-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scb-key{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em}
.scb-val{font-size:12px;font-weight:500;color:var(--text0)}
.scb-action{
  font-size:10px;color:var(--text1);font-family:var(--sans);
  padding:8px 10px;background:var(--bg3);border-radius:6px;line-height:1.5;
}

/* ═══════════════════════════════════════════════
   PORTFOLIO SCREEN
═══════════════════════════════════════════════ */
.port-hero{
  padding:20px 16px;background:var(--bg1);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.ph-left{}
.ph-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.ph-val{font-size:36px;font-weight:300;color:var(--text0)}
.ph-sub{font-size:10px;color:var(--text2);font-family:var(--sans);margin-top:3px}

.alloc-section{padding:16px}
.alloc-ring-row{display:flex;align-items:center;gap:20px}
.alloc-legend-list{display:flex;flex-direction:column;gap:10px;flex:1}
.al-item{display:flex;align-items:center;justify-content:space-between}
.al-left{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text1);font-family:var(--sans)}
.al-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.al-pct{font-size:14px;font-weight:600;color:var(--text0)}
.al-bar-wrap{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:3px}
.al-bar-fill{height:100%;border-radius:2px;transition:width .8s var(--ease-out)}

.holdings-list{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.holding-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:14px;
}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.hc-ticker{font-size:16px;font-weight:600;color:var(--text0)}
.hc-name{font-size:9px;color:var(--text2);font-family:var(--sans);margin-top:2px}
.hc-price{text-align:right}
.hc-price-val{font-size:18px;font-weight:500;color:var(--text0)}
.hc-price-dd{font-size:10px;margin-top:1px}
.hc-note{font-size:10px;color:var(--text2);font-family:var(--sans);font-style:italic;padding-top:8px;border-top:1px solid var(--border)}

.rules-section{padding:0 16px 16px}
.rule-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;margin-bottom:6px;font-size:11px;font-family:var(--sans);color:var(--text1);
}
.ri-val{font-family:var(--mono);font-weight:600;color:var(--text0);margin-right:2px}
.ri-no{padding:1px 5px;background:var(--red-d);color:var(--red);border-radius:2px;font-size:8px;font-weight:700;margin-right:4px;font-family:var(--mono)}

/* ── RESEARCH WORKFLOW ── */
.rq-hero{padding:20px 16px 16px;background:var(--bg1);border-bottom:1px solid var(--border)}
.rq-hero-title{font-size:20px;font-weight:600;color:var(--text0);margin-bottom:4px}
.rq-hero-sub{font-size:11px;color:var(--text2);font-family:var(--sans);line-height:1.5}
.rq-pipeline{display:flex;gap:0;padding:12px 16px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.rq-pipeline::-webkit-scrollbar{display:none}
.rq-stage{flex:1;min-width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;position:relative}
.rq-stage::after{content:'›';position:absolute;right:-4px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}
.rq-stage:last-child::after{display:none}
.rq-stage-num{font-size:22px;font-weight:600}
.rq-stage-num.s-pending{color:var(--text2)}
.rq-stage-num.s-active{color:var(--amber)}
.rq-stage-num.s-done{color:var(--green)}
.rq-stage-label{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;text-align:center}
.rq-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.rq-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rq-card.pri-high{border-left:3px solid var(--green)}
.rq-card.pri-med{border-left:3px solid var(--amber)}
.rq-card.pri-done{border-left:3px solid var(--text3);opacity:.65}
.rq-card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:10px}
.rq-ticker{font-size:16px;font-weight:600;color:var(--text0);letter-spacing:.03em}
.rq-name{font-size:9px;color:var(--text2);font-family:var(--sans)}
.rq-schip{padding:3px 8px;border-radius:3px;font-size:8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.rqs-pending{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.rqs-researching{background:var(--amber-d);color:var(--amber);border:1px solid rgba(255,170,0,.2)}
.rqs-done{background:var(--green-d);color:var(--green);border:1px solid rgba(0,240,130,.2)}
.rqs-monitoring{background:var(--cyan-d);color:var(--cyan);border:1px solid rgba(0,217,245,.2)}
.rq-card-body{padding:0 14px 12px}
.cmd-block{background:var(--bg0);border:1px solid var(--border);border-radius:6px;padding:9px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cmd-text{font-family:var(--mono);font-size:11px;color:var(--cyan);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-copy-btn{flex-shrink:0;padding:4px 10px;background:var(--cyan-d);border:1px solid var(--cyan);border-radius:4px;color:var(--cyan);font-size:9px;font-weight:600;font-family:var(--mono);cursor:pointer;transition:all .12s;letter-spacing:.06em}
.cmd-copy-btn:hover{background:var(--cyan);color:var(--bg0)}
.cmd-copy-btn.copied{background:var(--green-d);border-color:var(--green);color:var(--green)}
.prompt-toggle{font-size:9px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;padding:4px 0;border:none;background:none;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:color .12s;width:100%}
.prompt-toggle:hover{color:var(--text1)}
.prompt-box{display:none;background:var(--bg0);border:1px solid var(--border);border-radius:6px;padding:12px;margin-top:6px;font-size:10px;font-family:var(--sans);color:var(--text1);line-height:1.7;white-space:pre-wrap;max-height:220px;overflow-y:auto}
.prompt-box.open{display:block}
.prompt-copy-btn{margin-top:8px;padding:4px 10px;background:var(--violet-d);border:1px solid var(--violet);border-radius:4px;color:var(--violet);font-size:9px;font-weight:600;font-family:var(--mono);cursor:pointer;transition:all .12s;letter-spacing:.06em}
.prompt-copy-btn:hover{background:var(--violet);color:var(--bg0)}
.prompt-copy-btn.copied{background:var(--green-d);border-color:var(--green);color:var(--green)}
.git-steps{display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.git-step{display:flex;align-items:flex-start;gap:8px;font-size:10px;font-family:var(--sans);color:var(--text2);padding:3px 0}
.git-step-num{width:16px;height:16px;border-radius:50%;background:var(--bg3);color:var(--text2);font-size:8px;font-weight:700;font-family:var(--mono);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.git-step code{font-family:var(--mono);font-size:9px;background:var(--bg0);padding:1px 5px;border-radius:3px;color:var(--cyan)}

/* ── MISC ── */
.sec-head{
  padding:16px 16px 8px;
  display:flex;align-items:center;gap:10px;
}
.sec-head-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
.sec-head-line{flex:1;height:1px;background:var(--border)}
.sec-head-count{font-size:9px;color:var(--text3)}

/* verdict badges */
.vbadge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:3px;font-size:8px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.vb-watch{background:var(--cyan-d);color:var(--cyan);border:1px solid #00d9f520}
.vb-worthy{background:var(--violet-d);color:var(--violet);border:1px solid #b08fff20}
.vb-pass{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.vb-buy{background:var(--green-d);color:var(--green);border:1px solid #00f08220}

.empty-state{
  padding:32px;text-align:center;color:var(--text2);
  font-family:var(--sans);font-size:12px;font-style:italic;
}

/* Scroll indicator */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

/* stagger animation utility */
.s-anim{opacity:0;transform:translateY(10px);animation:fadeUp .35s ease forwards}
</style>
</head>
<body>

<!-- ═══════ INTRO ═══════ -->
<div id="intro">
  <div class="intro-mark">
    <div class="hex-wrap">
      <svg class="hex-svg" viewBox="0 0 72 72" width="72" height="72">
        <defs>
          <linearGradient id="ig" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00d9f5"/>
            <stop offset="100%" stop-color="#00f082"/>
          </linearGradient>
        </defs>
        <polygon class="hex-ring" points="36,4 60,18 60,46 36,60 12,46 12,18"
          fill="none" stroke="url(#ig)" stroke-width="2.5" stroke-linejoin="round"/>
        <polyline class="hex-tick" points="20,36 31,48 52,24"
          fill="none" stroke="url(#ig)" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-logo" onclick="navigateTo('home')">

        <polygon points="14,2 24,8 24,20 14,26 4,20 4,8" fill="none" stroke="url(#tlg)" stroke-width="1.5"/>
        <polyline points="8,14 12,19 20,9" fill="none" stroke="url(#tlg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Screens -->
  <div class="screens">

        <circle cx="10" cy="10" r="3"/>
      </svg>
      Signals

        <circle cx="9" cy="9" r="5"/>
        <path d="M15 15l-3-3" stroke-linecap="round"/>

      <span class="nav-badge" id="nb-research" style="display:none"></span>

        <rect x="3" y="7" width="14" height="11" rx="1"/>
        <path d="M7 7V5a3 3 0 016 0v2"/>

      Portfolio
    </button>

</div>

<!-- Side drawer -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="side-drawer" id="sideDrawer">
  <div class="drawer-header">
    <div style="font-size:14px;font-weight:600"><span class="tick-part">TICK</span><span class="reja-part">REJA</span></div>
    <button class="drawer-close" onclick="toggleDrawer()">✕</button>
  </div>
  <div class="drawer-nav">
    <div class="dnav-item active" data-screen="home" onclick="navigateTo('home');toggleDrawer()">
      <span class="dnav-icon">⌂</span>Home
    </div>
    <div class="dnav-item" data-screen="watchlist" onclick="navigateTo('watchlist');toggleDrawer()">
      <span class="dnav-icon">◈</span>Watchlist
      <span class="dnav-badge" id="dn-watchlist" style="display:none"></span>
    </div>
    <div class="dnav-item" data-screen="signals" onclick="navigateTo('signals');toggleDrawer()">
      <span class="dnav-icon">◉</span>Signals
      <span class="dnav-badge" id="dn-signals" style="display:none"></span>
    </div>
    <div class="dnav-item" data-screen="research" onclick="navigateTo('research');toggleDrawer()">
      <span class="dnav-icon">⌕</span>Research
      <span class="dnav-badge" id="dn-research" style="display:none"></span>
    </div>
    <div class="dnav-item" data-screen="portfolio" onclick="navigateTo('portfolio');toggleDrawer()">
      <span class="dnav-icon">◻</span>Portfolio
    </div>
  </div>
  <div class="drawer-footer" id="drawerFooter">—</div>

<script>
// ── UTILS ─────────────────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const esc=s=>s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';
const fp=v=>v==null?'—':'$'+Number(v).toFixed(2);
const fn=(v,d=1)=>v==null?'—':Number(v).toFixed(d);
const fpct=(v,d=1)=>v==null?'—':(v>0?'+':'')+Number(v).toFixed(d)+'%';
const fBig=v=>{if(!v)return'—';if(v>=1e12)return'$'+(v/1e12).toFixed(2)+'T';if(v>=1e9)return'$'+(v/1e9).toFixed(1)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(1)+'M';return'$'+v};
const fDate=s=>{if(!s)return'—';const d=new Date(s);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})};

const THEME={
  mega_cap_ai:{color:'#00d9f5',label:'Mega-Cap AI'},
  platform_network:{color:'#b08fff',label:'Platform'},
  power_grid:{color:'#ffaa00',label:'Power Grid'},
  edge_ai_silicon:{color:'#6366f1',label:'Edge AI'},
  cybersecurity:{color:'#ff4455',label:'Cybersec'},
  nuclear_smr:{color:'#00f082',label:'Nuclear SMR'},
  robotics_automation:{color:'#22d3ee',label:'Robotics'},
  defense_tech:{color:'#94a3b8',label:'Defense'},
  networking_infra:{color:'#38bdf8',label:'Networking'},
  quality_compounder:{color:'#0ea5e9',label:'Quality'},
  defensive_income:{color:'#84cc16',label:'Defensive'},
  healthcare_innovation:{color:'#ec4899',label:'Healthcare'},
  financials:{color:'#14b8a6',label:'Financials'},
  real_estate:{color:'#a3a3a3',label:'REITs'},
  consumer_media:{color:'#f43f5e',label:'Consumer/Media'},
  datacenter_infra:{color:'#f97316',label:'DC Infra'},
};
const tc=k=>THEME[k]||{color:'#7a9ab8',label:k||'—'};

function vbadge(v){
  const m={'WATCHLIST':['vb-watch','WATCH'],'RESEARCH-WORTHY':['vb-worthy','RESEARCH'],'PASS':['vb-pass','PASS'],'BUY':['vb-buy','BUY']};
  const[c,l]=m[v]||['vb-pass',v||'—'];
  return`<span class="vbadge ${c}">${l}</span>`;
}
function acClass(a){if(!a)return'watch';if(a.startsWith('BUY'))return'buy';if(a.startsWith('WAIT'))return'wait';if(a.startsWith('DROP'))return'pass';return'watch'}
function acColor(a){const c=acClass(a);return c==='buy'?'var(--green)':c==='wait'?'var(--amber)':c==='pass'?'var(--red)':'var(--cyan)'}

let DB = null;
let historyStack = ['home'];
let currentScreen = 'home';
let selectedStock = null;

// ── INTRO ANIMATION ───────────────────────────────────────────────────────────
function runIntro(){
  const letters = 'TICKREJA'.split('');
  const wordmark = $('introWordmark');
  letters.forEach((l, i) => {
    const span = document.createElement('span');
    span.className = 'letter ' + (i < 4 ? 'tick' : 'reja');
    span.textContent = l;
    span.style.animationDelay = (0.6 + i * 0.08) + 's';
    wordmark.appendChild(span);
  });
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function navigateTo(screen, data=null, pushHistory=true){
  if(screen === currentScreen && screen !== 'stock') return;

  const prev = $('screen-'+currentScreen);
  const next = $('screen-'+screen);
  if(!next) return;

  const goingBack = historyStack.length > 1 && historyStack[historyStack.length-2] === screen;

  if(goingBack){
    prev.className='screen hidden-right';
    next.className='screen active';
    historyStack.pop();
  } else {
    prev.className='screen hidden-left';
    next.className='screen active';
    if(pushHistory) historyStack.push(screen);
  }

  currentScreen = screen;

  // update nav buttons
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));
  document.querySelectorAll('.dnav-item').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));

  if(screen==='stock' && data){
    selectedStock = data;
    renderStockDetail(data);
    // Kick off an immediate live-price fetch for this single ticker — don't wait 60s
    fetchOneTicker(data.ticker).then(q => {
      if (q) {
        liveCache[q.symbol] = { price: q.price, change: q.change, pct: q.pct };
        selectedStock.current_price = q.price;
        const el = document.querySelector('.detail-price');
        if (el) el.textContent = '$' + q.price.toFixed(2);
      }
    }).catch(()=>{});
  }

  // Scroll to top
  next.scrollTop = 0;
}

function goBack(){
  if(historyStack.length>1){
    const target = historyStack[historyStack.length-2];
    navigateTo(target, null, false);
  }
}

// ── RENDER WATCHLIST ──────────────────────────────────────────────────────────
function renderWatchlist(data){
  const all = data.watchlist.all;
  let activeFilter = 'all';
  let activeTheme = 'all';

  // Themes present in the data, with counts, sorted by count desc
  const themeCounts = {};
  all.forEach(s=>{ const t=s.theme||'unknown'; themeCounts[t]=(themeCounts[t]||0)+1; });
  const themeKeys = Object.keys(themeCounts).filter(t=>t!=='unknown').sort((a,b)=>themeCounts[b]-themeCounts[a]);

  function build(filter, searchQ='', theme='all'){
    let base = filter==='all' ? all : filter==='buy' ? (data.watchlist.by_verdict['RESEARCH-WORTHY']||[]) : filter==='watch' ? (data.watchlist.by_verdict['WATCHLIST']||[]) : (data.watchlist.by_verdict['PASS']||[]);
    if(theme!=='all') base = base.filter(s=>(s.theme||'')===theme);
    const q = searchQ.trim().toLowerCase();
    let stocks = q ? base.filter(s=>(s.ticker||'').toLowerCase().includes(q)||(s.name||'').toLowerCase().includes(q)||(s.theme||'').toLowerCase().includes(q)) : base;

    let html=`
    <div class="screen-header">
      <button class="sh-back" onclick="goBack()">← Back</button>
      <div class="sh-title">Watchlist</div>
      <div class="sh-sub">${stocks.length} of ${all.length} stocks</div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-input" id="wl-search" type="text" placeholder="Search ticker, name, theme…" value="${esc(searchQ)}" oninput="handleSearch(this.value)">
    </div>
    <div class="filter-row">
      <span class="filter-chip ${filter==='all'?'active':''}" onclick="setFilter('all')">All ${all.length}</span>
      <span class="filter-chip ${filter==='buy'?'active':''}" onclick="setFilter('buy')">Buy-Ready ${(data.watchlist.by_verdict['RESEARCH-WORTHY']||[]).length}</span>
      <span class="filter-chip ${filter==='watch'?'active':''}" onclick="setFilter('watch')">Watching ${(data.watchlist.by_verdict['WATCHLIST']||[]).length}</span>
      <span class="filter-chip ${filter==='pass'?'active':''}" onclick="setFilter('pass')">Pass ${(data.watchlist.by_verdict['PASS']||[]).length}</span>
    </div>
    <div class="filter-row theme-row">
      <span class="filter-chip theme-chip ${theme==='all'?'active':''}" onclick="setTheme('all')">All Themes</span>
      ${themeKeys.map(t=>`<span class="filter-chip theme-chip ${theme===t?'active':''}" onclick="setTheme('${t}')" style="${theme===t?`background:${tc(t).color};border-color:${tc(t).color}`:`border-color:${tc(t).color}66`}"><span style="width:7px;height:7px;border-radius:50%;background:${tc(t).color};display:inline-block;margin-right:5px"></span>${esc(tc(t).label)} ${themeCounts[t]}</span>`).join('')}
    </div>
    <div class="wl-list">`;

    stocks.forEach((s,i)=>{
      const price=s.current_price??s.price;
      const dd=s.drawdown_from_high;
      const ddColor=dd&&Math.abs(dd)>=20?'var(--green)':dd&&Math.abs(dd)>=10?'var(--amber)':'var(--text2)';
      const t=tc(s.theme);
      const ac=acClass(s.next_action||'');
      html+=`<div class="wl-card s-anim" data-live="${esc(s.ticker)}" style="animation-delay:${i*.04}s" onclick="openStock(${JSON.stringify(s).replace(/"/g,'&quot;')})">
        <div class="wl-card-top">
          <div>
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">
              <span style="width:8px;height:8px;border-radius:50%;background:${t.color};display:inline-block;flex-shrink:0"></span>
              <span class="wl-card-ticker">${esc(s.ticker)}</span>
              ${vbadge(s.verdict)}
              ${s.confidence?`<span class="conf-badge conf-${esc((s.confidence||'').toLowerCase())}">${esc(s.confidence)}</span>`:''}
              ${s.data_ok===false?`<span class="data-warn" title="${esc((s.data_flags||[]).map(f=>f.msg).join(' · '))}">⚠ DATA</span>`:''}
            </div>
            <div class="wl-card-name">${esc(s.name)}</div>
          </div>
          <div class="wl-card-badges">
            <span class="lp" style="font-size:17px;font-weight:300;color:var(--text0)">${fp(price)}</span>
            ${dd!=null?`<span style="font-size:10px;color:${ddColor};font-weight:500">${fpct(dd,1)} ATH</span>`:''}
          </div>
        </div>
        <div class="wl-card-metrics">
          ${s.pe?`<div class="wm"><div class="wm-label">P/E</div><div class="wm-val ${s.pe>100?'lo':s.pe<20?'hi':''}">${fn(s.pe,1)}×</div></div>`:''}
          ${s.forward_pe?`<div class="wm"><div class="wm-label">Fwd P/E</div><div class="wm-val ${s.forward_pe<20?'hi':''}">${fn(s.forward_pe,1)}×</div></div>`:''}
          ${s.revenue_growth!=null?`<div class="wm"><div class="wm-label">Rev Grw</div><div class="wm-val ${s.revenue_growth>30?'hi':s.revenue_growth<5?'lo':'mid'}">${s.revenue_growth>0?'+':''}${s.revenue_growth}%</div></div>`:''}
          ${s.op_margin!=null?`<div class="wm"><div class="wm-label">Op Mgn</div><div class="wm-val ${s.op_margin>35?'hi':''}">${fn(s.op_margin,1)}%</div></div>`:''}
          ${s.buy_target?`<div class="wm"><div class="wm-label">Target</div><div class="wm-val" style="color:var(--green)">${fp(s.buy_target)}</div></div>`:''}
        </div>
        <div class="wl-action-row">
          <span class="wl-action-icon" style="color:${acColor(s.next_action||'')}">${ac==='buy'?'▲':ac==='wait'?'◎':ac==='pass'?'✕':'→'}</span>
          <span>${esc((s.next_action||'').substring(0,90))}${(s.next_action||'').length>90?'…':''}</span>
        </div>
      </div>`;
    });
    html+=`</div>`;
    $('screen-watchlist').innerHTML = html;
    // Restore focus to search if it was active
    const si = $('wl-search');
    if(si && searchQ){ si.focus(); si.setSelectionRange(si.value.length,si.value.length); }
  }

  let searchQuery = '';
  window.setFilter = f => { activeFilter=f; build(f, searchQuery, activeTheme); };
  window.setTheme  = t => { activeTheme=t; build(activeFilter, searchQuery, t); };
  window.handleSearch = q => { searchQuery=q; build(activeFilter, q, activeTheme); };
  build('all', '', 'all');
}

// ── RENDER SIGNALS ────────────────────────────────────────────────────────────
function renderSignals(data){
  const sig = data.signals;
  const urgent = (sig.upcoming_earnings||[]).filter(e=>e.days_until<=3).length + (sig.pullback_alerts||[]).length + (sig.price_movers||[]).length;

  $('nb-signals').textContent = urgent;
  $('nb-signals').style.display = urgent>0?'flex':'none';
  $('dn-signals').textContent = urgent;
  $('dn-signals').style.display = urgent>0?'flex':'none';

  let html=`
  <div class="screen-header">
    <button class="sh-back" onclick="goBack()">← Back</button>
    <div class="sh-title">Signals</div>
    <div class="sh-sub">${urgent} urgent items</div>
  </div>
  <div class="sig-feed">`;

  // ── Movers: why something jumped/dropped (most timely, shown first) ───────
  const movers = sig.price_movers||[];
  if(movers.length){
    html+=`<div class="sig-section-title">⚡ Movers — Why It Moved</div>`;
    html+=`<div class="news-list">`;
    movers.forEach((m,i)=>{
      const up = m.direction==='up';
      const pct = m.pct_day!=null?m.pct_day:m.pct_since;
      const col = up?'var(--green)':'var(--red)';
      const news0 = (m.news&&m.news[0])||{};
      const safeUrl=(news0.url||'').startsWith('http')?news0.url:'';
      html+=`<div class="mover-card s-anim" style="animation-delay:${i*0.03}s;border-left:3px solid ${col}">
        <div class="news-head">
          <span class="news-ticker">${esc(m.ticker)}</span>
          ${vbadge(m.verdict)}
          <span class="mover-pct" style="color:${col};margin-left:auto">${up?'▲':'▼'} ${pct>0?'+':''}${fn(pct,1)}%</span>
        </div>
        <div class="mover-reason">${esc(m.reason||'')}</div>
        ${safeUrl?`<a class="report-link" href="${esc(safeUrl)}" target="_blank" rel="noopener noreferrer">${esc(news0.title||'Read more')} ↗</a>`:''}
      </div>`;
    });
    html+=`</div>`;
  }

  // Earnings
  (sig.upcoming_earnings||[]).forEach((e,i)=>{
    const s = data.watchlist.all.find(x=>x.ticker===e.ticker)||{};
    const cls=e.days_until<=3?'stl-earnings':'stl-earnings';
    html+=`<div class="sig-card s-anim" style="animation-delay:${i*.05}s" onclick="openStock(${JSON.stringify({...s,...e}).replace(/"/g,'&quot;')})">

        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:16px;font-weight:600;color:var(--text0)">${esc(e.ticker)}</span>
          ${vbadge(e.verdict)}
          <span style="font-size:9px;color:${tc(e.theme).color}">${esc(tc(e.theme).label)}</span>
        </div>
        <span class="sig-type-label ${cls}">📅 Earnings</span>
      </div>
      <div class="sig-card-body">
        <div class="scb-row">
          <span class="scb-key">Date</span>
          <span class="scb-val ${e.days_until<=3?'lo':e.days_until<=5?'mid':''}">${fDate(e.date)} · <strong>${e.days_until}d away</strong></span>
        </div>
        <div class="scb-action">${esc(e.action)}</div>
        <a class="report-link" href="https://finance.yahoo.com/quote/${esc(e.ticker)}/press-releases" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">📄 Read earnings reports ↗</a>
      </div>
    </div>`;
  });

  // Pullbacks
  (sig.pullback_alerts||[]).forEach((s,i)=>{
    html+=`<div class="sig-card s-anim" style="animation-delay:${i*.05}s" onclick="openStock(${JSON.stringify(s).replace(/"/g,'&quot;')})">

function renderResearch(data){
  const all = data.watchlist.all || [];
  const staleAlerts = (data.signals && data.signals.stale_research) || [];
  const staleTickers = new Set(staleAlerts.map(s => s.ticker));

  // Buckets: needs research, in progress, stale, completed
  const needs    = all.filter(s => !s.last_researched && s.verdict !== 'PASS');
  const progress = all.filter(s => s.status === 'researching' || s.status === 'pending');
  // Stale = research older than ~90 days (from signals.stale_research join)
  const stale    = all.filter(s => staleTickers.has(s.ticker)).map(s => {
    const alert = staleAlerts.find(a => a.ticker === s.ticker);
    return { ...s, _stale_days: alert ? alert.days_since : null, _stale_action: alert ? alert.action : null };
  });
  // Completed = has research and not stale
  const done     = all
    .filter(s => s.last_researched && !staleTickers.has(s.ticker))
    .sort((a,b) => (b.last_researched||'').localeCompare(a.last_researched||''));

  const card = (s, sub, accent, expanded=false) => {
    const t = tc(s.theme);
    const v = vbadge(s.verdict);
    const accentBar = accent ? `style="border-left:3px solid ${accent}"` : '';
    const price = s.current_price ?? s.price;
    return `<div class="rsearch-card s-anim" ${accentBar} onclick='openStock(${JSON.stringify(s).replace(/'/g,"&#39;")})'>
      <div class="rs-card-top">
        <span class="rs-dot" style="background:${t.color}"></span>
        <div class="rs-card-info">
          <div class="rs-card-tk">${esc(s.ticker)} <span class="rs-card-nm">· ${esc(s.name||'')}</span></div>
          <div class="rs-card-sub">${sub}</div>
        </div>
        ${v}
      </div>
      ${expanded ? `
      <div class="rs-card-body">
        ${s.thesis ? `
          <div class="rs-block">
            <div class="rs-block-label">THESIS</div>
            <div class="rs-block-text">${esc(s.thesis)}</div>
          </div>` : ''}
        ${s.next_action ? `
          <div class="rs-block">
            <div class="rs-block-label" style="color:var(--amber)">NEXT ACTION</div>
            <div class="rs-block-text" style="color:var(--text1)">${esc(s.next_action)}</div>
          </div>` : ''}
        <div class="rs-meta">
          ${price ? `<span class="rs-meta-item">Price: <strong>${fp(price)}</strong></span>` : ''}
          ${s.buy_target ? `<span class="rs-meta-item">Target: <strong style="color:var(--green)">${fp(s.buy_target)}</strong></span>` : ''}
          ${s.last_researched ? `<span class="rs-meta-item">Researched: <strong>${esc(s.last_researched)}</strong></span>` : ''}
        </div>
      </div>` : ''}
    </div>`;
  };

  const sect = (label, arr, empty, accent, subFn, expanded=false) => `
    <div class="rs-section">
      <div class="rs-sec-head">
        <span class="rs-sec-label" ${accent?`style="color:${accent}"`:''}>${label}</span>
        <span class="rs-sec-count">${arr.length}</span>
      </div>
      ${arr.length === 0
        ? `<div class="rs-empty">${empty}</div>`
        : arr.map((s)=>card(s, subFn?subFn(s):label.toLowerCase(), accent, expanded)).join('')}
    </div>`;

  let html = `
    <div class="screen-pad">
      <div class="screen-title-block s-anim">
        <div class="screen-title">Research</div>
        <div class="screen-sub">Track research progress across the watchlist</div>
      </div>

      ${sect('Needs Research', needs,    'All active candidates have research notes ✓')}
      ${sect('In Progress',    progress, 'Nothing in flight right now')}
      ${sect('Stale — Refresh Recommended', stale, 'No stale research', 'var(--amber)',
             (s) => s._stale_days ? `${s._stale_days} days old · ${s._stale_action||'rerun research_ticker.py'}` : 'stale',
             true)}
      ${sect('Completed', done, 'No completed research yet', null,
             (s) => s.last_researched ? `Researched ${s.last_researched}` : '',
             true)}
    </div>

    <style>
      .rs-section { margin-bottom: 24px; }
      .rs-sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 4px; }
      .rs-sec-label { font-size: 11px; font-weight: 700; color: var(--text1); letter-spacing: 0.06em; text-transform: uppercase; }
      .rs-sec-count { font-size: 10px; color: var(--text2); padding: 1px 7px; background: var(--bg2); border-radius: 8px; }
      .rs-empty { font-size: 12px; color: var(--text2); padding: 12px; background: var(--bg1); border: 1px dashed var(--border); border-radius: 10px; text-align: center; }
      .rsearch-card { padding: 12px; background: var(--bg1); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s, transform .15s; }

  $('screen-research').innerHTML = html;

// ── LIVE PRICES via Yahoo Finance v8 chart endpoint (no auth required) ──────
const liveCache = {};
// allorigins/raw is our most reliable free CORS proxy.
// corsproxy.io became paid-only in 2026 (returns {"error":"..."} on free tier).
// Order matters: try the proxy that actually works first.
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
];

async function fetchOneTicker(ticker){
  // v8/finance/chart works without crumb auth, unlike v7/finance/quote
  const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`;
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(yahooUrl), { cache: 'no-store' });
      if (!res.ok) continue;
      const text = await res.text();
      // Some proxies return HTML error pages or JSON error envelopes — bail before parsing
      if (!text || text[0] !== '{') continue;
      let data;
      try { data = JSON.parse(text); } catch { continue; }
      // corsproxy.io paywall returns { error: "..." } with HTTP 200
      if (data.error) continue;
      const result = data?.chart?.result?.[0];
      if (!result) continue;
      const meta = result.meta || {};
      const price = meta.regularMarketPrice;
      const prevClose = meta.chartPreviousClose ?? meta.previousClose;
      if (price == null) continue;
      const change = prevClose ? price - prevClose : 0;
      const pct = prevClose ? (change / prevClose) * 100 : 0;
      return { symbol: ticker, price, change, pct };
    } catch(e) { /* try next proxy */ }
  }
  console.warn(`[live] All proxies failed for ${ticker}`);
  return null;
}

async function fetchLivePrices(tickers){
  const dot = document.querySelector('.pulse');
  if (dot) dot.style.background = 'var(--amber)'; // amber while fetching

  const results = await Promise.all(tickers.map(fetchOneTicker));
  let okCount = 0;
  results.forEach(q => {
    if (q) {
      liveCache[q.symbol] = { price: q.price, change: q.change, pct: q.pct };
      okCount++;
    }
  });
  updateLivePricesInUI();

  if (dot) {
    if (okCount === tickers.length) dot.style.background = 'var(--green)';
    else if (okCount > 0)            dot.style.background = 'var(--amber)';
    else                              dot.style.background = 'var(--red)';
    dot.title = `${okCount}/${tickers.length} live · last ${new Date().toLocaleTimeString()}`;
  }

  if (okCount === 0) console.warn('All live price proxies failed');
}

function updateLivePricesInUI(){
  // Patch every element with data-live="TICKER" — covers home rows + watchlist cards
  document.querySelectorAll('[data-live]').forEach(el=>{
    const ticker = el.dataset.live;
    const q = liveCache[ticker];
    if(!q) return;
    const priceEl = el.querySelector('.lp');
    const changeEl = el.querySelector('.lc');
    if(priceEl) priceEl.textContent = '$'+q.price.toFixed(2);
    if(changeEl){
      const s = q.change>=0?'+':'';
      changeEl.textContent = s+q.pct.toFixed(2)+'%';
      changeEl.style.color = q.change>=0?'var(--green)':'var(--red)';
    }
    // flash bg
    el.style.transition='background .3s';
    el.style.background = q.change>=0?'rgba(0,240,130,.07)':'rgba(255,68,85,.07)';
    setTimeout(()=>el.style.background='', 700);
  });

  // Also update open stock detail if visible — re-render fully so all references
  // (price, % from ATH, metrics) stay consistent
  if(currentScreen==='stock' && selectedStock){
    const q = liveCache[selectedStock.ticker];
    if(q){
      // Mutate selectedStock with the live price so the next render pass uses it
      selectedStock.current_price = q.price;
      const el = document.querySelector('.detail-price');
      if(el) el.textContent = '$'+q.price.toFixed(2);
    }
  }
}

// Expose for inline onclick
window.openStock=openStock;
window.navigateTo=navigateTo;
window.goBack=goBack;
window.toggleDrawer=toggleDrawer;
// setFilter + handleSearch set dynamically inside renderWatchlist
</script>
</body>
</html>
