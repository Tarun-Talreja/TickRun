<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TickRun — Conviction Portfolio</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body { font-family: 'Space Grotesk', system-ui, sans-serif; background: #000; }
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum"; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, createElement: h } = React;

const DASHBOARD_URL = "https://raw.githubusercontent.com/Tarun-Talreja/TickRun/main/output/dashboard.json";

const SAMPLE = {
  last_built: null,
  quotes_updated: null,
  portfolio: {
    total_value: 0,
    core: [{ ticker: "VTI", name: "Vanguard Total Stock Market ETF", shares: 0, cost_basis_per_share: 0, current_price: null, market_value: null, pnl: null, pnl_pct: null, notes: "Core anchor — 60% of portfolio target" }],
    thematic: [],
    target_allocation: { core_pct: 60, thematic_pct: 35, international_pct: 5 }
  },
  watchlist: {
    all: [
      { ticker: "POWL", name: "Powell Industries", theme: "power_grid", verdict: "RESEARCH-WORTHY", thesis: "Switchgear for data centers. Benefits from AI-driven power buildout.", price: null, drawdown_from_high: null, next_action: "Verify customer concentration in 10-K Item 1" },
      { ticker: "ALAB", name: "Astera Labs", theme: "edge_ai_silicon", verdict: "RESEARCH-WORTHY", thesis: "Connectivity chips (PCIe, CXL) for AI data centers.", price: null, drawdown_from_high: null, next_action: "Verify hyperscaler customer concentration" },
      { ticker: "BWXT", name: "BWX Technologies", theme: "nuclear_smr", verdict: "WATCHLIST", thesis: "Naval nuclear + SMR components. Profitable defense contractor.", price: null, drawdown_from_high: null, next_action: "Check SMR contract pipeline" },
      { ticker: "ONTO", name: "Onto Innovation", theme: "edge_ai_silicon", verdict: "RESEARCH-WORTHY", thesis: "Semiconductor metrology for advanced node transitions.", price: null, drawdown_from_high: null, next_action: "Check China revenue exposure" },
      { ticker: "QLYS", name: "Qualys", theme: "cybersecurity", verdict: "RESEARCH-WORTHY", thesis: "Cloud-native vulnerability management SaaS.", price: null, drawdown_from_high: null, next_action: "Verify net revenue retention rate" }
    ],
    counts: { total: 5, research_worthy: 4, watchlist: 1, pass: 0, red_flag: 0 }
  },
  themes: {
    power_grid:       { name: "Power Grid / Electrification", color: "#f59e0b" },
    nuclear_smr:      { name: "SMR / Uranium", color: "#10b981" },
    edge_ai_silicon:  { name: "Edge AI / Silicon", color: "#6366f1" },
    cybersecurity:    { name: "Cybersecurity", color: "#ef4444" },
    robotics_automation: { name: "Robotics / Automation", color: "#8b5cf6" },
    defense_tech:     { name: "Defense Tech", color: "#64748b" },
    networking_infra: { name: "Networking / Fiber", color: "#0ea5e9" }
  },
  signals: { pullback_alerts: [], stale_research: [], upcoming_earnings: [] }
};

// ── utils ──────────────────────────────────────────────────────────────────
const fmt = (n, d = 2) => n == null ? "—" : Number(n).toFixed(d);
const fmtUSD = (n) => n == null ? "—" : "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = (n) => n == null ? "—" : `${n >= 0 ? "+" : ""}${Number(n).toFixed(1)}%`;
const pctColor = (n) => n == null ? "text-zinc-500" : n > 0 ? "text-emerald-400" : n < 0 ? "text-rose-400" : "text-zinc-300";
const timeAgo = (iso) => {
  if (!iso) return "never";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
};

const VERDICT_STYLE = {
  "RESEARCH-WORTHY": "bg-emerald-500/20 text-emerald-300 border-emerald-500/40",
  "WATCHLIST":        "bg-amber-500/20 text-amber-300 border-amber-500/40",
  "PASS":             "bg-zinc-700/40 text-zinc-500 border-zinc-600/30",
  "RED FLAG":         "bg-rose-500/20 text-rose-300 border-rose-500/40",
};

// ── PortfolioView ──────────────────────────────────────────────────────────
const HoldingRow = ({ h: holding, isCore }) => {
  const empty = !holding.shares || holding.shares === 0;
  return h('tr', { className: "border-t border-zinc-900 hover:bg-zinc-950/50" },
    h('td', { className: "py-3 pr-4" },
      h('div', { className: "font-bold text-zinc-100 text-sm" }, holding.ticker),
      h('div', { className: "text-zinc-500 text-[10px] mt-0.5 max-w-[160px] truncate" }, holding.name || "")
    ),
    h('td', { className: "py-3 pr-4 mono text-xs text-zinc-400" }, empty ? "—" : holding.shares),
    h('td', { className: "py-3 pr-4 mono text-xs text-zinc-400" }, empty ? "—" : fmtUSD(holding.cost_basis_per_share)),
    h('td', { className: "py-3 pr-4 mono text-xs text-zinc-300" }, holding.current_price ? fmtUSD(holding.current_price) : "—"),
    h('td', { className: "py-3 pr-4 mono text-xs text-zinc-300" }, holding.market_value ? fmtUSD(holding.market_value) : "—"),
    h('td', { className: `py-3 mono text-xs ${pctColor(holding.pnl_pct)}` }, holding.pnl_pct != null ? fmtPct(holding.pnl_pct) : "—")
  );
};

const PortfolioView = ({ data }) => {
  const port = data.portfolio;
  const allHoldings = [...(port.core || []), ...(port.thematic || [])];
  const hasHoldings = allHoldings.some(h => h.shares && h.shares > 0);
  const target = port.target_allocation || {};

  return h('div', { className: "space-y-6" },
    h('div', { className: "grid grid-cols-3 gap-3" },
      h('div', { className: "border border-zinc-800 rounded-lg bg-zinc-950 p-4" },
        h('div', { className: "text-[10px] tracking-[0.18em] text-zinc-500 font-medium mb-2" }, "TOTAL VALUE"),
        h('div', { className: "mono text-2xl text-zinc-100" }, port.total_value > 0 ? fmtUSD(port.total_value) : "—"),
        h('div', { className: "text-[10px] text-zinc-600 mt-1" }, "updated " + timeAgo(data.quotes_updated))
      ),
      h('div', { className: "border border-zinc-800 rounded-lg bg-zinc-950 p-4" },
        h('div', { className: "text-[10px] tracking-[0.18em] text-zinc-500 font-medium mb-2" }, "TARGET ALLOCATION"),
        h('div', { className: "space-y-1.5" },
          [["Core (VTI/VOO)", target.core_pct, "bg-emerald-400"],
           ["Thematic picks", target.thematic_pct, "bg-violet-400"],
           ["International", target.international_pct, "bg-sky-400"]]
          .map(([label, pct, color]) =>
            h('div', { key: label, className: "flex items-center gap-2" },
              h('div', { className: `h-1.5 rounded-full ${color}/60`, style: { width: `${pct}%` } }),
              h('span', { className: "mono text-[10px] text-zinc-500" }, `${pct}% ${label}`)
            )
          )
        )
      ),
      h('div', { className: "border border-zinc-800 rounded-lg bg-zinc-950 p-4" },
        h('div', { className: "text-[10px] tracking-[0.18em] text-zinc-500 font-medium mb-2" }, "RULES"),
        h('div', { className: "space-y-1" },
          ["No options", "No margin", "No leveraged ETFs", "Max 15% per position", "Hold 3-5 years min"]
          .map(r => h('div', { key: r, className: "text-[10px] text-zinc-500 flex items-center gap-1.5" },
            h('span', { className: "text-emerald-500" }, "✓"),
            r
          ))
        )
      )
    ),

    !hasHoldings && h('div', { className: "border border-zinc-800 border-dashed rounded-xl p-8 text-center" },
      h('div', { className: "text-zinc-500 text-sm mb-2" }, "No holdings recorded yet"),
      h('div', { className: "mono text-[11px] text-zinc-600" }, "Edit data/portfolio.json to add your positions")
    ),

    hasHoldings && h('div', { className: "border border-zinc-800 rounded-lg overflow-hidden" },
      h('div', { className: "bg-zinc-900/50 px-4 py-2.5 text-[10px] tracking-[0.18em] text-zinc-500 font-medium" }, "HOLDINGS"),
      h('div', { className: "overflow-x-auto" },
        h('table', { className: "w-full" },
          h('thead', null,
            h('tr', null,
              ["TICKER", "SHARES", "COST", "PRICE", "VALUE", "P&L"].map(col =>
                h('th', { key: col, className: "text-left py-2 px-0 pr-4 text-[9px] tracking-[0.18em] text-zinc-600 font-medium first:pl-4" }, col)
              )
            )
          ),
          h('tbody', { className: "divide-y divide-zinc-900" },
            (port.core || []).map(holding => h(HoldingRow, { key: holding.ticker, h, holding, isCore: true })),
            (port.thematic || []).length > 0 && h('tr', { className: "border-t border-zinc-800" },
              h('td', { colSpan: 6, className: "py-2 pl-4 text-[9px] tracking-[0.18em] text-zinc-600 font-medium" }, "THEMATIC PICKS")
            ),
            (port.thematic || []).map(holding => h(HoldingRow, { key: holding.ticker, h, holding, isCore: false }))
          )
        )
      )
    )
  );
};

// ── WatchlistView ──────────────────────────────────────────────────────────
const CandidateCard = ({ c, themes }) => {
  const [open, setOpen] = useState(false);
  const theme = themes[c.theme] || {};
  const verdictStyle = VERDICT_STYLE[c.verdict] || VERDICT_STYLE["PASS"];

  return h('div', {
    className: "border border-zinc-800 rounded-xl bg-zinc-950 overflow-hidden hover:border-zinc-700 transition-colors cursor-pointer",
    onClick: () => setOpen(o => !o)
  },
    h('div', { className: "p-4" },
      h('div', { className: "flex items-start justify-between gap-3 mb-2" },
        h('div', null,
          h('div', { className: "flex items-baseline gap-2 flex-wrap" },
            h('span', { className: "font-bold text-zinc-100 text-lg" }, c.ticker),
            h('span', { className: "text-zinc-400 text-sm" }, c.name)
          ),
          theme.name && h('div', { className: "text-[10px] mono mt-0.5", style: { color: theme.color || "#71717a" } }, theme.name.toUpperCase())
        ),
        h('div', { className: "flex flex-col items-end gap-1.5 shrink-0" },
          h('span', { className: `text-[9px] mono px-2 py-0.5 rounded border font-medium tracking-wider ${verdictStyle}` }, c.verdict || "UNKNOWN"),
          c.price && h('span', { className: "mono text-xs text-zinc-300" }, "$" + fmt(c.price)),
          c.drawdown_from_high != null && c.drawdown_from_high <= -20 &&
            h('span', { className: "mono text-[10px] text-amber-400" }, fmtPct(c.drawdown_from_high) + " from high")
        )
      ),
      c.thesis && h('p', { className: "text-xs text-zinc-400 leading-relaxed line-clamp-2" }, c.thesis)
    ),
    open && h('div', { className: "border-t border-zinc-800 px-4 py-3 space-y-3 bg-zinc-900/30" },
      c.thesis && h('div', null,
        h('div', { className: "text-[9px] tracking-[0.18em] text-zinc-500 font-medium mb-1" }, "THESIS"),
        h('p', { className: "text-xs text-zinc-300 leading-relaxed" }, c.thesis)
      ),
      c.next_action && h('div', null,
        h('div', { className: "text-[9px] tracking-[0.18em] text-amber-500 font-medium mb-1" }, "NEXT ACTION"),
        h('p', { className: "text-xs text-amber-300/80 leading-relaxed" }, c.next_action)
      ),
      c.last_researched && h('div', { className: "mono text-[10px] text-zinc-600" }, "Last researched: " + c.last_researched)
    )
  );
};

const WatchlistView = ({ data }) => {
  const [filter, setFilter] = useState("all");
  const counts = data.watchlist.counts || {};
  const all = data.watchlist.all || [];
  const FILTER_TO_VERDICT = { "research-worthy": "RESEARCH-WORTHY", "watchlist": "WATCHLIST", "pass": "PASS", "red-flag": "RED FLAG" };
  const filtered = filter === "all" ? all : all.filter(c => c.verdict === FILTER_TO_VERDICT[filter]);
  const themes = data.themes || {};

  const tabs = [
    { id: "all", label: "ALL", count: counts.total },
    { id: "research-worthy", label: "RESEARCH-WORTHY", count: counts.research_worthy },
    { id: "watchlist", label: "WATCHLIST", count: counts.watchlist },
    { id: "pass", label: "PASS", count: counts.pass },
  ].filter(t => t.id === "all" || t.count > 0);

  return h('div', { className: "space-y-4" },
    h('div', { className: "flex gap-1 flex-wrap" },
      tabs.map(t => h('button', {
        key: t.id,
        onClick: () => setFilter(t.id),
        className: `px-3 py-1.5 text-[10px] tracking-[0.12em] font-medium rounded transition-colors ${filter === t.id ? "bg-zinc-100 text-black" : "text-zinc-500 hover:text-zinc-300 border border-zinc-800"}`
      }, `${t.label} ${t.count != null ? "(" + t.count + ")" : ""}`)
      )
    ),
    filtered.length === 0
      ? h('div', { className: "border border-zinc-800 border-dashed rounded-xl p-8 text-center text-zinc-600 text-sm" }, "No candidates in this category")
      : h('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-3" },
          filtered.map(c => h(CandidateCard, { key: c.ticker, c, themes }))
        )
  );
};

// ── SignalsView ────────────────────────────────────────────────────────────
const SignalsView = ({ data }) => {
  const signals = data.signals || {};
  const pullbacks = signals.pullback_alerts || [];
  const earnings = signals.upcoming_earnings || [];
  const stale = signals.stale_research || [];
  const total = pullbacks.length + earnings.length + stale.length;

  return h('div', { className: "space-y-6" },
    total === 0 && h('div', { className: "border border-zinc-800 border-dashed rounded-xl p-8 text-center" },
      h('div', { className: "text-zinc-500 text-sm mb-1" }, "No signals today"),
      h('div', { className: "mono text-[11px] text-zinc-600" }, "Pullback alerts and earnings will appear here once quotes are refreshed")
    ),

    pullbacks.length > 0 && h('div', null,
      h('div', { className: "text-[10px] tracking-[0.18em] text-zinc-500 font-medium mb-3" }, `PULLBACK ALERTS · ${pullbacks.length}`),
      h('div', { className: "space-y-2" },
        pullbacks.map(a => h('div', { key: a.ticker, className: "border border-zinc-800 rounded-lg bg-zinc-950 p-4 flex items-start justify-between gap-4" },
          h('div', null,
            h('div', { className: "flex items-baseline gap-2 mb-1" },
              h('span', { className: "font-bold text-zinc-100" }, a.ticker),
              h('span', { className: "text-zinc-400 text-sm" }, a.name),
              h('span', { className: `text-[9px] mono px-1.5 py-0.5 rounded border ${a.severity === "STRONG" ? "bg-rose-500/20 text-rose-300 border-rose-500/40" : "bg-amber-500/20 text-amber-300 border-amber-500/40"}` }, a.severity)
            ),
            a.thesis && h('p', { className: "text-xs text-zinc-500 leading-relaxed" }, a.thesis),
            h('p', { className: "text-[10px] text-amber-400/70 mt-1.5" }, a.action)
          ),
          h('div', { className: "text-right shrink-0" },
            h('div', { className: "mono text-rose-400 text-sm font-medium" }, fmtPct(a.drawdown_pct)),
            h('div', { className: "mono text-[10px] text-zinc-500" }, "from 52w high"),
            a.price && h('div', { className: "mono text-xs text-zinc-300 mt-1" }, "$" + fmt(a.price))
          )
        ))
      )
    ),

    earnings.length > 0 && h('div', null,
      h('div', { className: "text-[10px] tracking-[0.18em] text-zinc-500 font-medium mb-3" }, `UPCOMING EARNINGS · ${earnings.length}`),
      h('div', { className: "space-y-2" },
        earnings.map(e => h('div', { key: e.ticker, className: "border border-zinc-800 rounded-lg bg-zinc-950 p-4 flex items-center justify-between gap-4" },
          h('div', null,
            h('div', { className: "flex items-baseline gap-2 mb-0.5" },
              h('span', { className: "font-bold text-zinc-100" }, e.ticker),
              h('span', { className: "text-zinc-400 text-sm" }, e.name),
              h('span', { className: `text-[9px] mono px-1.5 py-0.5 rounded border ${VERDICT_STYLE[e.verdict] || "bg-zinc-800 text-zinc-500 border-zinc-700"}` }, e.verdict)
            ),
            h('p', { className: "text-[10px] text-amber-400/70" }, e.action)
          ),
          h('div', { className: "text-right shrink-0 mono" },
            h('div', { className: "text-zinc-100 text-sm" }, e.date),
            h('div', { className: "text-zinc-500 text-[10px]" }, `in ${e.days_until}d`)
          )
        ))
      )
    ),

    stale.length > 0 && h('div', null,
      h('div', { className: "text-[10px] tracking-[0.18em] text-zinc-500 font-medium mb-3" }, `STALE RESEARCH · ${stale.length}`),
      h('div', { className: "space-y-2" },
        stale.map(s => h('div', { key: s.ticker, className: "border border-zinc-800 rounded-lg bg-zinc-950 p-3 flex items-center justify-between gap-4" },
          h('span', { className: "text-zinc-300 text-sm" }, s.ticker + " — research is " + s.days_since + " days old"),
          h('span', { className: "mono text-[10px] text-zinc-500" }, s.action)
        ))
      )
    )
  );
};

// ── App ────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("watchlist");
  const [data, setData] = useState(SAMPLE);
  const [loading, setLoading] = useState(true);
  const [live, setLive] = useState(false);

  const load = async () => {
    setLoading(true);
    try {
      const res = await fetch(DASHBOARD_URL + "?t=" + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      setData(await res.json());
      setLive(true);
    } catch (e) {
      console.log("Using sample data:", e.message);
    }
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const TABS = [
    { id: "watchlist", label: "WATCHLIST" },
    { id: "portfolio", label: "PORTFOLIO" },
    { id: "signals",   label: "SIGNALS" },
  ];

  const counts = data.watchlist.counts || {};
  const signals = data.signals || {};
  const alertCount = (signals.pullback_alerts || []).length + (signals.upcoming_earnings || []).length;

  return h('div', { className: "min-h-screen bg-black text-zinc-200" },
    h('header', { className: "border-b border-zinc-900 sticky top-0 bg-black/95 backdrop-blur z-10" },
      h('div', { className: "max-w-5xl mx-auto px-4 py-3" },
        h('div', { className: "flex items-center justify-between mb-3" },
          h('div', { className: "flex items-center gap-2.5" },
            h('svg', { width: "26", height: "26", viewBox: "0 0 28 28", fill: "none" },
              h('rect', { width: "28", height: "28", rx: "6", fill: "#18181b" }),
              h('polyline', { points: "4,20 10,13 15,17 24,7", stroke: "#34d399", strokeWidth: "2.2", strokeLinecap: "round", strokeLinejoin: "round", fill: "none" }),
              h('circle', { cx: "24", cy: "7", r: "2", fill: "#34d399" })
            ),
            h('span', { className: "font-bold text-lg text-zinc-100 tracking-tight" }, "TickRun"),
            h('span', { className: "text-[10px] tracking-[0.2em] text-zinc-600 font-medium hidden sm:block" }, "CONVICTION PORTFOLIO")
          ),
          h('div', { className: "flex items-center gap-3" },
            data.quotes_updated && h('span', { className: "mono text-[10px] text-zinc-600 hidden sm:block" }, "quotes " + timeAgo(data.quotes_updated)),
            h('button', {
              onClick: load, disabled: loading,
              className: "mono text-[11px] tracking-wider text-zinc-400 hover:text-zinc-200 disabled:opacity-40"
            }, loading ? "LOADING…" : "↻ REFRESH")
          )
        ),
        h('nav', { className: "flex gap-1" },
          TABS.map(t => {
            const badge = t.id === "watchlist" ? counts.research_worthy : t.id === "signals" ? alertCount : null;
            return h('button', {
              key: t.id, onClick: () => setTab(t.id),
              className: `px-3 py-1.5 text-[11px] tracking-[0.15em] font-medium rounded transition-colors flex items-center gap-1.5 ${tab === t.id ? "bg-zinc-100 text-black" : "text-zinc-500 hover:text-zinc-300"}`
            },
              t.label,
              badge > 0 && h('span', { className: `text-[9px] px-1.5 py-0.5 rounded-full ${tab === t.id ? "bg-black/20 text-black/60" : "bg-zinc-700 text-zinc-300"}` }, badge)
            );
          })
        )
      )
    ),

    !live && h('div', { className: "bg-amber-500/10 border-b border-amber-500/20 text-amber-300/80 text-[11px] px-4 py-1.5 text-center mono" },
      "SAMPLE DATA — live data loads from output/dashboard.json once GitHub Actions runs"
    ),

    h('main', { className: "max-w-5xl mx-auto px-4 py-6" },
      tab === "portfolio" && h(PortfolioView, { data }),
      tab === "watchlist" && h(WatchlistView, { data }),
      tab === "signals"   && h(SignalsView, { data })
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
